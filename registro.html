<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · VerdeVital</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315803d'/%3E%3Cpath d='M32 16c-4 6-8 10-8 18 0 4 4 8 8 8s8-4 8-8c0-8-4-12-8-18z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], serif: ['Playfair Display', 'Georgia', 'serif'] },
          colors: { vv: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#14532d',900:'#052e16',cream:'#f5f1e8',earth:'#e8e0cf' } }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="font-sans bg-vv-cream/30 text-slate-800 antialiased min-h-screen flex flex-col">

  <div id="navbar"></div>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-vv-700 to-vv-500 mx-auto flex items-center justify-center text-white text-2xl mb-3">🌱</div>
        <h1 class="text-2xl font-serif font-bold">Crea tu cuenta</h1>
        <p class="text-slate-600 text-sm">Únete a la comunidad VerdeVital</p>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl p-6 lg:p-8 shadow-sm">
        <form id="register-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1.5">Nombre completo</label>
            <input name="name" type="text" required autocomplete="name" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-vv-700 focus:ring-2 focus:ring-vv-100">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Email</label>
            <input name="email" type="email" required autocomplete="email" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-vv-700 focus:ring-2 focus:ring-vv-100">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Teléfono (opcional)</label>
            <input name="phone" type="tel" placeholder="+56 9 1234 5678" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-vv-700 focus:ring-2 focus:ring-vv-100">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Contraseña</label>
            <input name="password" id="pw" type="password" required minlength="6" autocomplete="new-password" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-vv-700 focus:ring-2 focus:ring-vv-100">
            <div class="mt-2 h-1 bg-slate-200 rounded-full overflow-hidden">
              <div id="strength-fill" class="h-full transition-all" style="width:0%"></div>
            </div>
            <p id="strength-text" class="text-xs text-slate-500 mt-1">Mínimo 6 caracteres</p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Confirmar contraseña</label>
            <input name="confirm" type="password" required minlength="6" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-vv-700 focus:ring-2 focus:ring-vv-100">
          </div>
          <div class="flex items-start gap-2 pt-2">
            <input type="checkbox" id="terms" required class="mt-1 accent-vv-700">
            <label for="terms" class="text-xs text-slate-600">Acepto los <a href="terminos-condiciones.html" class="text-vv-700 underline">términos y condiciones</a> y la <a href="politicas-privacidad.html" class="text-vv-700 underline">política de privacidad</a>.</label>
          </div>
          <button type="submit" class="w-full bg-vv-700 text-white py-3 rounded-xl font-semibold hover:bg-vv-800">Crear cuenta</button>
        </form>
      </div>

      <p class="text-center text-sm text-slate-600 mt-6">
        ¿Ya tienes cuenta? <a href="login.html" class="text-vv-700 font-semibold hover:text-vv-800">Inicia sesión</a>
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    VV.mountNavbar('');
    VV.mountFooter();

    const pw = document.getElementById('pw');
    const fill = document.getElementById('strength-fill');
    const txt = document.getElementById('strength-text');
    pw.addEventListener('input', () => {
      const s = Store.auth.passwordStrength(pw.value);
        const colors = { weak: 'bg-red-500 w-1/3', medium: 'bg-amber-500 w-2/3', strong: 'bg-vv-600 w-full' };
        fill.className = 'h-full transition-all ' + colors[s.level];
        txt.textContent = 'Fortaleza: ' + s.label;
        txt.className = 'text-xs mt-1 ' + (s.level === 'weak' ? 'text-red-600' : s.level === 'medium' ? 'text-amber-600' : 'text-vv-700');
    });

    document.getElementById('register-form').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      if (fd.get('password') !== fd.get('confirm')) {
        VV.toast('Las contraseñas no coinciden', 'error'); return;
      }
      const r = Store.auth.register({
        name: fd.get('name'),
        email: fd.get('email'),
        phone: fd.get('phone'),
        password: fd.get('password')
      });
      if (!r.ok) { VV.toast(r.error, 'error'); return; }
      VV.toast('¡Cuenta creada! Bienvenido a VerdeVital', 'success');
      setTimeout(() => location.href = 'perfil.html', 700);
    });
  </script>
</body>
</html>
