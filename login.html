<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · VerdeVital</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315803d'/%3E%3Cpath d='M32 16c-4 6-8 10-8 18 0 4 4 8 8 8s8-4 8-8c0-8-4-12-8-18z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], serif: ['Playfair Display', 'Georgia', 'serif'] },
          colors: { vv: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#14532d',900:'#052e16',cream:'#f5f1e8',earth:'#e8e0cf' } }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="font-sans bg-vv-cream/30 text-slate-800 antialiased min-h-screen flex flex-col">

  <div id="navbar"></div>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-vv-700 to-vv-500 mx-auto flex items-center justify-center text-white text-2xl mb-3">🌱</div>
        <h1 class="text-2xl font-serif font-bold">Bienvenido de vuelta</h1>
        <p class="text-slate-600 text-sm">Ingresa a tu cuenta de VerdeVital</p>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl p-6 lg:p-8 shadow-sm">
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1.5">Email</label>
            <input name="email" type="email" required autocomplete="email" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-vv-700 focus:ring-2 focus:ring-vv-100">
          </div>
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="text-sm font-medium">Contraseña</label>
              <a href="recuperar-password.html" class="text-xs text-vv-700 hover:text-vv-800 font-semibold">¿Olvidaste tu contraseña?</a>
            </div>
            <input name="password" type="password" required autocomplete="current-password" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-vv-700 focus:ring-2 focus:ring-vv-100">
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="remember" class="accent-vv-700">
            <label for="remember" class="text-sm text-slate-700">Mantenerme conectado</label>
          </div>
          <button type="submit" class="w-full bg-vv-700 text-white py-3 rounded-xl font-semibold hover:bg-vv-800">Iniciar sesión</button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-200">
          <p class="text-xs text-center text-slate-500 mb-2">Cuenta demo:</p>
          <div class="bg-vv-cream rounded-lg p-3 text-xs space-y-1">
            <p><strong>Email:</strong> demo@verdevital.cl</p>
            <p><strong>Contraseña:</strong> demo1234</p>
          </div>
        </div>
      </div>

      <p class="text-center text-sm text-slate-600 mt-6">
        ¿Aún no tienes cuenta? <a href="registro.html" class="text-vv-700 font-semibold hover:text-vv-800">Crea una</a>
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    VV.mountNavbar('');
    VV.mountFooter();

    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = Store.auth.login(fd.get('email'), fd.get('password'));
      if (!r.ok) { VV.toast(r.error, 'error'); return; }
      VV.toast(`¡Bienvenido ${r.user.name.split(' ')[0]}!`, 'success');
      const ret = new URLSearchParams(location.search).get('return') || 'perfil.html';
      setTimeout(() => location.href = ret, 700);
    });
  </script>
</body>
</html>
